name: Windows CI

on:
  push:
    branches: [ main, refactor ]
  pull_request:
    branches: [ main, refactor ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install ninja -y
    
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -G "Visual Studio 17 2022" \
          -A x64 \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DBUILD_TESTS=ON \
          -DBUILD_HOST=OFF
    
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 4
    
    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
    
    - name: Package VST3
      run: |
        cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --prefix ${{github.workspace}}/package
        mkdir -p ${{github.workspace}}/artifacts
        cp -r ${{github.workspace}}/package/SpectralTable.vst3 ${{github.workspace}}/artifacts/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: SpectralTable-Windows-VST3
        path: ${{github.workspace}}/artifacts/SpectralTable.vst3